# 库表存储默认跟随 mode（local→sqlite）。切换 MySQL 只需设置环境变量：
#   CONTROL_DB_DRIVER=mysql 以及 CONTROL_MYSQL_USER/CONTROL_MYSQL_PASSWORD 等（见 README）。
# 应用账号只需 SELECT/INSERT/UPDATE，建表与迁移用管理员账号执行一次。
mode: local
listen:
  api: 127.0.0.1:8080
  preview: 127.0.0.1:8081
  internal: 127.0.0.1:8082
  metrics: 127.0.0.1:9090
web:
  origin: http://127.0.0.1:8080
control:
  secret_file: ./data/secret.key
sqlite:
  path: ./data/control.db
auth:
  cookie_secure: false
catalog:
  file: ./models.local.yaml
sandbox:
  driver: local
  internal_url: http://127.0.0.1:8082
local:
  root: ./data/sandboxes
  wsd_bin: ../bin/wsd
  template_dir: ../image/templates/react-go-sqlite
  agent_runtime_bin: ../agent-runtime/bin/agent-runtime
  image_ver: local-dev
  goproxy: https://goproxy.cn,direct
preview:
  domain: localhost
  scheme: http
  public_address: "{key}.preview.localhost:8081"
  cookie_secure: true
